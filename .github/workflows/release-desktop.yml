name: desktop · שחרור

on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci
        working-directory: desktop
      - run: npm run check
        working-directory: desktop
      # No Apple Developer account, so the DMG ships unsigned and unnotarised.
      # Disable electron-builder's signing attempt rather than let it fail.
      - run: npm run dist
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: softprops/action-gh-release@v2
        with:
          name: "macOS ${{ github.ref_name }}"
          files: desktop/dist/*.dmg
          generate_release_notes: true
          body: |
            ## התקנה

            הקובץ אינו חתום בתעודת Apple, ולכן בפתיחה הראשונה macOS יחסום אותו.
            לחיצה ימנית על האפליקציה ← **Open** ← **Open** שוב, פעם אחת בלבד.

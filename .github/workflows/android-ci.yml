name: android · בדיקות

on:
  push:
    branches: [main]
    paths: ["mobile/**", "shared/**", ".github/workflows/android-ci.yml"]
  pull_request:
    paths: ["mobile/**", "shared/**", ".github/workflows/android-ci.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: tool/sync_shared.sh
        working-directory: mobile
      - run: flutter pub get
        working-directory: mobile
      - run: dart format --output=none --set-exit-if-changed .
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test
        working-directory: mobile
